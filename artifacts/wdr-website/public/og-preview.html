<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff3e2;
  overflow: hidden;
}
.logo {
  width: 180px;
  height: 180px;
  margin-bottom: 30px;
}
.title {
  font-size: 52px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  text-align: center;
}
.subtitle {
  font-size: 24px;
  font-weight: 400;
  color: rgba(255, 243, 226, 0.7);
  text-align: center;
  max-width: 700px;
  line-height: 1.4;
}
.accent-bar {
  width: 60px;
  height: 4px;
  background: #055e65;
  margin-bottom: 30px;
  border-radius: 2px;
}
</style>
</head>
<body>
<img class="logo" src="/images/wdr-rabbit-nav.png" alt="">
<div class="accent-bar"></div>
<div class="title">WHITE DRUNK RABBIT</div>
<div class="subtitle">The Creative Concierge</div>
</body>
</html>
