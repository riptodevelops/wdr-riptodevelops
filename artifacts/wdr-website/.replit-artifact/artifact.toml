kind = "web"
previewPath = "/wdr-website/"
title = "White Drunk Rabbit Website"
version = "1.0.0"
id = "artifacts/wdr-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/wdr-website/" ]
localPort = 24038

[services.development]
run = "pnpm --filter @workspace/wdr-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wdr-website", "run", "build" ]
publicDir = "artifacts/wdr-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24038"
BASE_PATH = "/wdr-website/"
